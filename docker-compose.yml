services:
  delamain:
    build: .
    image: ghcr.io/vonhex/delamain:latest
    container_name: delamain
    restart: unless-stopped
    ports:
      - "8888:8888"   # web UI, API and WebSocket
    volumes:
      # F5-TTS model weights — download separately, see README
      - ./checkpoints:/app/checkpoints
      # Database, voice clips, and your reference audio (delamain_ref_10s.wav)
      - ./data:/app/data
      # Optional: Obsidian vault for notes and long-term memory
      - ${OBSIDIAN_VAULT_PATH:-./vault}:/vault
    environment:
      - LLM_URL=${LLM_URL:-http://host.docker.internal:8080/v1/chat/completions}
      - LLM_MODEL=${LLM_MODEL:-}
      - LLM_REASONING_EFFORT=${LLM_REASONING_EFFORT:-}
      - TOOLS_ENABLED=${TOOLS_ENABLED:-true}
      - SEARXNG_URL=${SEARXNG_URL:-}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:8888}
    # GPU passthrough — uncomment if using NVIDIA GPU for F5-TTS
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
