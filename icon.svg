<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="60%">
      <stop offset="0" stop-color="#10202a"/>
      <stop offset="1" stop-color="#05080c"/>
    </radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <circle cx="256" cy="256" r="242" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="230" fill="none" stroke="#00f3ff" stroke-width="14" filter="url(#glow)"/>
  <circle cx="256" cy="256" r="208" fill="none" stroke="#00f3ff" stroke-opacity="0.25" stroke-width="3"/>
  <g fill="none" stroke="#00f3ff" stroke-linejoin="miter" filter="url(#glow)" transform="translate(-6 -6)">
