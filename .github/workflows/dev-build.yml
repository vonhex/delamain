name: Dev Build

on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/delamain
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push (latest)
        uses: docker/build-push-action@v6
        with:
          context: .
          # Docker (not OCI) media types: Unraid's update check asks for a Docker v2 manifest, and the
          # registry answers 404 for an image published as OCI, so updates never show.
          outputs: type=image,push=true,oci-mediatypes=false
          tags: ghcr.io/${{ env.IMAGE_NAME }}:dev   # latest moves only with a release
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false
